
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro nativo</title>
  <link rel="stylesheet" href="../estilos.css">
</head>

<body>
  <main>
    <h1>Registro · Nivel 1</h1>

    <form action="https://jsonplaceholder.typicode.com/posts" method="post">

      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input
          id="nombre"
          name="nombre"
          type="text"
          required
          minlength="3"
          maxlength="60"
          autocomplete="name"
        >
      </div>

      <div class="campo">
        <label for="email">Correo</label>
        <input
          id="email"
          name="email"
          type="email"
          required
          autocomplete="email"
        >
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          minlength="8"
          pattern="(?=.*[A-Za-z])(?=.*\d).{8,}"
          autocomplete="new-password"
        >
      </div>

      <div class="campo">
        <label for="confirmar">Confirmar contraseña</label>
        <input
          id="confirmar"
          name="confirmar"
          type="password"
          required
          autocomplete="new-password"
        >
      </div>

      <div class="campo">
        <label for="edad">Edad</label>
        <input
          id="edad"
          name="edad"
          type="number"
          required
          min="18"
          max="120"
          step="1"
        >
      </div>

      <div class="campo">
        <label for="pais">País</label>
        <select id="pais" name="pais" required>
          <option value="">Elige un país</option>
          <option>Colombia</option>
          <option>México</option>
          <option>Perú</option>
          <option>Argentina</option>
        </select>
      </div>

      <div class="campo">
        <label class="casilla" for="terminos">
          <input
            id="terminos"
            name="terminos"
            type="checkbox"
            required
          >
          Acepto términos
        </label>
      </div>

      <button type="submit">Crear cuenta</button>
    </form>

    <p class="ayuda">
      Esta versión usa exclusivamente validación nativa HTML.
      La coincidencia de contraseñas se valida en los niveles siguientes.
    </p>
  </main>
</body>
</html>
